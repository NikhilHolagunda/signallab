[project]
name = "signallab"
version = "0.1.0"
description = "Turn tech reels, GitHub stars and reading lists into a 3D knowledge graph."
requires-python = ">=3.11"
readme = "../README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["signallab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["SIM905"]
