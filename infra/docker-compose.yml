# SignalLab stack. From the repo root:   docker compose up --build
# (the root docker-compose.yml includes this file and loads ../.env)
name: signallab

x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-auto}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signallab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signallab}
      POSTGRES_DB: signallab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro # creates the `n8n` database
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signallab} -d signallab"]
      interval: 5s
      timeout: 5s
      retries: 20

  # yt-dlp + faster-whisper + MiniLM behind HTTP; called by n8n and the backend.
  worker:
    build:
      context: ../n8n/python-nodes
      dockerfile: ../../infra/worker.Dockerfile
    image: signallab-worker:dev
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      MIN_SPEECH_WORDS: ${MIN_SPEECH_WORDS:-8}
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-}
    volumes:
      - models:/models # Whisper + MiniLM weights survive rebuilds
      - ./secrets:/secrets:ro # drop an exported cookies.txt here for Instagram
    ports:
      - "${WORKER_PORT:-8001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n:
    image: n8nio/n8n:2.50.1
    # Imports + publishes n8n/workflows/*.json on every start, then runs n8n.
    entrypoint: ["tini", "--", "/bin/sh", "/opt/signallab/n8n-entrypoint.sh"]
    environment:
      <<: *llm-env
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-signallab}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-signallab}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      N8N_SECURE_COOKIE: "false" # plain http on localhost
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false" # the workflow reads WORKER_URL / OLLAMA_* / *_API_KEY via $env
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      WEBHOOK_URL: http://localhost:5678/
      WORKER_URL: http://worker:8001
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      SIGNALLAB_IMPORT_WORKFLOWS: ${SIGNALLAB_IMPORT_WORKFLOWS:-true}
    volumes:
      - n8ndata:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro
      - ./n8n-entrypoint.sh:/opt/signallab/n8n-entrypoint.sh:ro
    ports:
      - "${N8N_PORT:-5678}:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/signallab
      DATABASE_USER: ${POSTGRES_USER:-signallab}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-signallab}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 48)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/signallab-ingest
      INGEST_CALLBACK_BASE_URL: http://backend:8080
      ALLOWED_REEL_URL_PATTERN: ${ALLOWED_REEL_URL_PATTERN:-}
      WORKER_URL: http://worker:8001
      WORKER_TOKEN: ${WORKER_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
      args:
        BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  # Optional: `docker compose --profile ollama up` and set OLLAMA_URL=http://ollama:11434.
  # On Windows/macOS a native Ollama install (the default OLLAMA_URL) is usually faster.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  pgdata:
  n8ndata:
  models:
  ollama:
