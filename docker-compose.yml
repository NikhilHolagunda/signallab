# One-command boot:   docker compose up --build
# Then pull a model:  docker compose exec ollama ollama pull llama3.1:8b
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for NVIDIA GPUs (needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: http://ollama:11434
      SIGNALLAB_DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - signallab-data:/data
      - model-cache:/root/.cache   # Whisper + MiniLM weights
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ollama:
  signallab-data:
  model-cache:
